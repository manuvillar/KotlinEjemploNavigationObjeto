# Opciones de Gradle para todo el proyecto

# Memoria máxima para el proceso de Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Usamos las librerías AndroidX (las actuales de Android)
android.useAndroidX=true
# Estilo de código Kotlin oficial
kotlin.code.style=official
# Cada módulo solo ve su propia clase R (más rápido al compilar)
android.nonTransitiveRClass=true
# OJO: no añadir "android.builtInKotlin=false": con AGP 9 el Kotlin viene
# integrado y, si se desactiva, los ficheros .kt no se compilan.
